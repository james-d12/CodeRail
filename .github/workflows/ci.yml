name: CI
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    name: "Build And Test"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Cache SonarQube Cloud packages
        uses: actions/cache@v5
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarQube Cloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Cache NuGet packages
        uses: actions/cache@v5
        env:
          cache-name: nuget-package-cache
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-${{ env.cache-name }}

      - name: Install SonarQube Cloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${{ runner.temp }}/scanner"
          dotnet tool update dotnet-sonarscanner --tool-path "${{ runner.temp }}/scanner"

      - name: Restore dotnet tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore

      - name: Format Check
        run: dotnet format --no-restore --verify-no-changes --verbosity diagnostic

      - name: Check For Vulnerabilities
        run: dotnet list package --vulnerable

      - name: Build, Test and Analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
            "${{ runner.temp }}/scanner/dotnet-sonarscanner" begin \
              /k:"personal-james_coderail" \
              /o:"personal-james" \
              /n:"CodeRail" \
              /d:sonar.token="$SONAR_TOKEN" \
              /d:sonar.qualitygate.wait=false \
              /d:sonar.exclusions="**/bin/**,**/obj/**"

            dotnet build --no-restore

            dotnet test --no-build \
              --collect:"XPlat Code Coverage" \
              --results-directory ./coverage

            "${{ runner.temp }}/scanner/dotnet-sonarscanner" end \
              /d:sonar.token="$SONAR_TOKEN"

      - name: Publish
        run: dotnet publish --no-restore

      - name: Generate coverage report
        if: always()
        run: |
          dotnet reportgenerator \
            -reports:./coverage/**/coverage.cobertura.xml \
            -targetdir:./coverage/report \
            -reporttypes:"Html;MarkdownSummaryGithub"

      - name: Add coverage summary
        if: always()
        run: cat ./coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./coverage/report/**
